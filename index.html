<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배민 자동주문 리포트 어드민</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ee;--dim:#8b93a7;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb347;--acc:#4f8cff}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}header .who{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--dim);flex-wrap:wrap}
  input,select,textarea,button{font:inherit;color:var(--fg);background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  button{cursor:pointer}button.ok{background:var(--ok);color:#052;border-color:var(--ok);font-weight:700}button.bad{background:#3a1c1c;border-color:var(--bad);color:#ffb3b3;font-weight:700}
  nav{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:transparent;border-color:transparent;color:var(--dim);padding:8px 12px;border-radius:8px;white-space:nowrap}nav button.on{background:var(--card);color:var(--fg);border-color:var(--line)}
  main{padding:12px 16px;max-width:1200px;margin:0 auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}.kpi b{font-size:22px;display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .card .head{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}.card .head b{font-size:15px}.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:#22283a;color:var(--dim)}
  .tag.fail{background:#3a1c1c;color:#ffb3b3}.tag.ok{background:#173a2a;color:#9ff0c6}.tag.need{background:#3a2f14;color:#ffd58a}.tag.part{background:#1c2a3a;color:#9fd0ff}
  .reason{color:var(--dim);font-size:12px;margin:6px 0;word-break:break-all}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row>*{flex:0 0 auto}.row textarea,.row input[type=text]{flex:1 1 220px;min-width:180px}
  .muted{color:var(--dim)}.small{font-size:12px}.empty{color:var(--dim);padding:24px;text-align:center}
  .banner{border:1px solid var(--bad);background:#2a1616;color:#ffb3b3;border-radius:8px;padding:8px 12px;margin-bottom:10px}
  .group{color:var(--dim);font-size:12px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--dim);font-weight:600;white-space:nowrap}
  table.wide{min-width:1150px}td.nw{white-space:nowrap}.tag{white-space:nowrap}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#22283a;border:1px solid var(--line);padding:8px 14px;border-radius:8px;display:none;max-width:90vw;z-index:9}
  .toast.err{border-color:var(--bad);background:#2a1616;color:#ffb3b3}
  /* 카드 정보 줄 — 라벨:값 (태그 나열 금지, 주인님 2026-09-06) */
  .info{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:13px;margin:8px 0 4px}
  .info dt{color:var(--dim);white-space:nowrap}.info dd{margin:0;word-break:break-all}.info dd b{color:var(--acc)}
  .who{font-size:12px;color:var(--dim)}
  .explain{background:#1c2a3a;border:1px solid #27406a;border-radius:8px;padding:8px 10px;margin:8px 0 2px;font-size:13px;line-height:1.5}
  .explain b{color:#9fd0ff}
  /* 이름 게이트 — 세션(이름)이 없으면 먼저 받는다 */
  #gate{position:fixed;inset:0;background:rgba(10,12,16,.92);display:none;place-items:center;z-index:50}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px;width:min(92vw,420px)}
  #gate h2{margin:0 0 6px;font-size:18px}#gate p{margin:0 0 14px;color:var(--dim);font-size:13px}
  #gate input{width:100%;font-size:16px;padding:10px 12px;margin-bottom:10px}#gate button{width:100%;padding:10px}
</style>
</head>

  </div>
  <!-- ★ 전역 경고 바 (주인님 2026-09-23): 어드민에 배민 주문번호·상태를 못 쓰고 있으면 어느 탭에 있어도 보인다.
       담당자는 이 화면(리포트 어드민)만 본다 → 조용히 막히면 아무도 모른다. DOM 은 항상 두고 display 만 토글(재그리기와 무관).
       ★ 위치 = header 의 **마지막 자식**(적대적 검토 2026-09-23): header 밖(main 위)에 두면 표를 보려고 스크롤하는
       순간 화면에서 사라졌다. header 는 sticky 라 여기 두면 어느 탭·어디까지 내려도 계속 보인다.
       flex:1 0 100% = flex 인 header 안에서 한 줄을 통째로 차지(제목 옆에 끼어들지 않게). -->
  <div id="writeAlert" class="banner" style="display:none;flex:1 0 100%;margin:8px 0 0"></div>

  <button data-tab="questions">미답변 질문 <span id="nQ" class="tag">0</span></button>
  <button data-tab="learned">교정 반영</button>
</nav>
<main id="main"><div class="empty">허브에서 불러오는 중…</div></main>
<div class="toast" id="toast"></div>
<div id="gate"><div class="box">
  <h2>담당자 이름을 알려주세요</h2>
  <p>이 브라우저에 처음 오셨습니다. 여기서 누르는 버튼·적는 사유와 답에 이름이 남습니다 (AI 가 "누가 알려줬는지" 를 기록합니다).</p>
  <input id="gateName" type="text" placeholder="이름 (예: 홍길동)" autocomplete="off">
  <select id="gatePc" style="width:100%;margin-bottom:10px"><option value="">내 PC (선택 — 현황에 이름을 붙이려면 골라주세요)</option></select>
  <button class="ok" id="gateOk">시작하기</button>
</div></div>
<script>
// ── 허브 접속 (publishable 키 = Supabase 가 "공개해도 안전" 으로 명시한 공개용 키. 비밀키 아님) ──
const HUB_URL = "https://cgpdxysokoupymsnvpzk.supabase.co";
const HUB_KEY = "sb_publishable_KOS_oSZXAEXa17wc4SDroQ_2D-iEkpL";
const H = {"apikey":HUB_KEY,"Authorization":"Bearer "+HUB_KEY,"Content-Type":"application/json"};
const WINDOW_DAYS = 90;      // 백로그·교정·통계 창 (사유 백로그가 이 안에 있다 — 줄이면 담당자가 입력할 수단이 사라진다)
const LIVE_DAYS   = 3;       // 폴링 창 — 최근 3일 전체 + 사람 몫(날짜 무관)만 60초마다
const POLL_MS     = 60000;
const TIMEOUT_MS  = 15000;
// ★ egress 폭증(2026-09-09 실측 18.6GB/일): 30초마다 90일 전량(select=*, 2,357행×923B=2.17MB)을 세 탭이 받았다.
//   → 폴링은 "최근 3일 ∪ 사람 몫" 만, 목록 컬럼만(select 목록), 큰 글(ai_explain·reason·주소 근거)은 카드에 보일 때 그 행만.
//   90일 창은 탭을 열 때(백로그·교정·통계·지난 날짜 현황)만 받고 10분 캐시. 저장 후엔 PATCH 응답 행을 그대로 머지(재조회 0회).
const COLS = "id,order_id,pc_id,brand,store,hotel,menu,result,state,category,attempts,started_at,created_at,total_sec,baemin_no,human_action,human_reason_cat,human_by,human_at,learned,who_wrong,suggest_cat";
const DETAIL_COLS = "id,ai_explain,reason,addr_given,addr_query,addr_picked,store_query,human_note,case_key";
const QCOLS = "id,pc_id,topic,question,answer,answered_by,answered_at,applied,edited_at,created_at";
const HIST_TTL = 10*60000;
// PostgREST 는 한 번에 1,000행 — 다 받을 때까지 이어 받는다
async function get(path, signal){ let out=[], lo=0; for(;;){ const r=await fetch(HUB_URL+"/rest/v1/"+path,{headers:{...H,"Range":lo+"-"+(lo+999)},signal}); if(!r.ok) throw new Error(r.status+" "+await r.text()); const b=await r.json(); out=out.concat(b); if(b.length<1000) return out; lo+=1000; } }
// 쓰기: 조건(match)에 맞는 행만 바꾸고, 바뀐 행을 돌려받는다 — 0행이면 "이미 남이 처리" 로 판정 (낙관적 잠금)
async function patch(table, match, body){ const r=await fetch(HUB_URL+"/rest/v1/"+table+"?"+match,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)}); if(!r.ok) throw new Error(r.status+" "+await r.text()); const res=await r.json(); return Array.isArray(res)?res:[]; }
// 개수만 (본문 0바이트): Range 0-0 + count=exact → Content-Range "0-0/1427"
async function count(path, signal){ const r=await fetch(HUB_URL+"/rest/v1/"+path,{headers:{...H,"Range":"0-0","Prefer":"count=exact"},signal}); if(!r.ok) throw new Error(r.status+" "+await r.text()); const cr=r.headers.get("Content-Range")||""; const m=/\/(\d+)$/.exec(cr); return m?+m[1]:0; }
function errText(e){ if(e&&e.name==="AbortError") return "허브 응답 없음(15초) — 네트워크 확인"; const m=/^(\d{3})/.exec((e&&e.message)||""); if(m){ const c=+m[1]; if(c===401||c===403) return "권한 오류("+c+") — 키/정책 확인"; if(c>=500) return "허브 서버 오류("+c+")"; return "허브 오류("+c+")"; } return (navigator.onLine===false)?"오프라인 — 네트워크 확인":"연결 실패: "+((e&&e.message)||e); }

// ── 사유 분류 (PROCESS §2 표 그대로) ──
const REASONS = [
  ["매장없음","매장 없음 (영업안함/폐업)"],
  ["매장에메뉴없음","매장에 메뉴 없음"],
  ["이름다름","메뉴 이름이 달라서 못 찾음"],
  ["최소주문","최소주문 미달 / 금액 불일치"],
  ["주소AI실패","주소/호텔 못 찾음 — AI 가 못 찾음 (호텔은 실재)"],
  ["주소주문자오류","주소/호텔 못 찾음 — 주문자가 잘못 적음"],
  ["주문자오류","주문자 오류 (메뉴명 오타 등)"],
  ["기타","기타 (한 줄 설명)"],
];
const WHO = {"주소주문자오류":"주문자","주문자오류":"주문자"};
// 사람이 사유를 달아도 학습이 안 되는 분류 — 사유 입력 목록에서 뺀다. 이 집합은 배지 서버 카운트
//   refreshBacklogCount() 의 category=not.in.(…) 에도 **그대로 쓰인다**(한 군데만 고치면 둘 다 따라간다).
// ★ 2026-09-23 추가 3종 (주인님: "실패 사유 입력에 실제 담당자가 해줄 수 있는 내역만 보여줘") —
//   hub_shipper.NOT_LEARNABLE 의 같은 3종과 **글자까지 같아야 한다**(서버 배지 카운트가 이 목록으로 만들어진다).
//   · 장바구니/주문서 = 쿠폰팩 광고 오버레이·앱 사망 (실측 9/19·9/22 11건 중 6건이 앱 사망)
//   · 담기 결과 = 담기 도중 배민 크래시 → 재시도로 푸는 문제
//   · 선불권 = 잔액 부족은 '사유' 가 아니라 **충전 요청** — '지금 할 일' 의 충전 카드(opsCards)로 띄운다
const NOT_LEARNABLE = new Set(["매장영업시간","앱진입","인프라(폰/adb)","결제버튼못찾음","금액가드","매장문맥","코드오류",
  "장바구니/주문서","담기 결과","선불권"]);
// 부분 = 실전에서 치킨은 넣었고 음료만 담당자 몫. 연습 모드의 '(부분·연습)' 은 손님이 이미 받은 주문이라 담당자 일이 아니다
//   (2026-09-09 주인님: 9/8 연습 주문 41800 이 '지금 할 일' 에 떠 있었다) → 정확히 '음료단품없음(부분)' 만.
const PARTIAL = r => String(r.category||"")==="음료단품없음(부분)";
const STATE_KO = {human_takeover:"담당자 개입 — 수기 주문 중", human_needed:"파킹 — 직접 주문", store_cancelled:"매장 취소", ai_failed:"AI 실패", ai_success:"AI 완주", human_done:"담당자 완료", human_failed:"담당자 실패", mapped:"매핑됨", cancelled:"취소됨"};

let rows=[], qs=[], qsLite=[], tab="todo", viewDay="";        // viewDay: 현황 탭에서 보는 날짜 (빈값=오늘)
let live=[], hist=[], histAt=0, qsAt=0, nReasonsSrv=null;      // live: 폴링(3일∪사람몫) · hist: 90일(탭 열 때) · rows = hist ⊕ live
const details=new Map();                                        // id → {ai_explain, reason, addr_*, store_query, human_note, case_key}
let detailsBusy=false, histBusy=false, qsBusy=false, dataSeq=0;   // dataSeq: 머지가 일어나면 +1 — 그 전에 떠난 조회 응답은 버린다(경주 방지)
const sig = ms => (typeof AbortSignal!=="undefined" && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;
// 사람 몫(B) 판정 — 서버 B 쿼리와 같은 조건. 폴링 후 이 조건인데 B 에 없는 hist 행은 남이 닫은 것 → 버린다
const isHumanNeeded = r => !r.human_action && (r.state==="human_needed"||r.state==="store_cancelled"||r.state==="human_takeover"||PARTIAL(r));
function rebuildRows(){ const m=new Map(); for(const r of hist) m.set(r.id,r); for(const r of live) m.set(r.id,r); rows=[...m.values()].sort((a,b)=>(tsOf(b)-tsOf(a))||(b.id-a.id)); }
const full = r => details.has(r.id)? Object.assign({}, r, details.get(r.id)) : r;
// 저장 응답(return=representation: 전 컬럼)을 그대로 머지 — 재조회 없이 화면·배지 갱신
function mergeRows(upd){ dataSeq++; seq++; if(ctrl) ctrl.abort();      // 진행 중이던 폴링·조회 응답은 버린다(저장 직전 스냅샷이 저장을 되돌리는 경주)
  for(const u of upd){ if(!u||u.id==null) continue; const d={}; for(const k of DETAIL_COLS.split(",")) if(k!=="id" && k in u) d[k]=u[k]; if(Object.keys(d).length) details.set(u.id, Object.assign(details.get(u.id)||{}, d));
    const slim={}; for(const k of COLS.split(",")) if(k in u) slim[k]=u[k];
    let hit=false; live=live.map(r=>r.id===u.id?(hit=true,Object.assign({},r,slim)):r); hist=hist.map(r=>r.id===u.id?(hit=true,Object.assign({},r,slim)):r); if(!hit) live.push(slim); }
  rebuildRows(); }
function mergeQs(upd){ dataSeq++; for(const u of upd){ if(!u||u.id==null) continue; qs=qs.map(q=>q.id===u.id?Object.assign({},q,u):q); let hit=false; qsLite=qsLite.map(q=>q.id===u.id?(hit=true,Object.assign({},q,{answer:u.answer,applied:u.applied})):q); if(!hit) qsLite.push({id:u.id,answer:u.answer,applied:u.applied}); } }
let loadedOnce=false, lastOkAt=null, lastErr=null, seq=0, ctrl=null, composing=false, lastSnap="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
// 담당자 이름 = 이 브라우저의 세션. 없으면 게이트로 먼저 받는다 (주인님 2026-09-06: 누가 적었는지 알아야 한다)
let ME="", MYPC="", pcs={};                      // pcs: {pc_id: monitor} — PC↔담당자 짝 (허브 pcs 표)
try{ ME=(localStorage.getItem("me")||"").trim(); MYPC=(localStorage.getItem("mypc")||"").trim(); }catch(e){}
const me=()=>ME||"담당자";
function needName(){ if(ME) return true; showGate(); toast("담당자 이름을 먼저 적어주세요"); return false; }
function setInert(on){ for(const sel of ["main","header","nav"]){ const el=document.querySelector(sel); if(el) el.inert=on; } }
function showGate(){ $("#gateName").value=ME; const sel=$("#gatePc"); const cur=MYPC;
  sel.innerHTML='<option value="">내 PC (선택 — 현황에 이름을 붙이려면 골라주세요)</option>'+[...new Set(rows.map(pcOf))].sort().map(p=>`<option value="${esc(p)}" ${p===cur?"selected":""}>${esc(p)}${(pcs[p]||{}).monitor?` — 지금 ${esc(pcs[p].monitor)}`:""}</option>`).join("");
  $("#gate").style.display="grid"; setInert(true); setTimeout(()=>$("#gateName").focus(),50); }

// 일별 집계 — 주문 단위. 한 주문의 그날 시도 중 하나라도 완주면 완주, 완주 없이 부분만 있으면 부분, 둘 다 없으면 실패(유형은 마지막 시도의 분류)
function orderStats(rs){
  const orders=new Map();                                     // order_id → rows (시도시각 내림차순 유지)
  for(const r of rs){ if(!orders.has(r.order_id)) orders.set(r.order_id,[]); orders.get(r.order_id).push(r); }
  let done=0, part=0, fail=0; const cats=new Map(), pcsM=new Map();
  for(const [,ors] of orders){
    if(ors.some(x=>x.result==="완주"&&!PARTIAL(x))) done++;
    else if(ors.some(PARTIAL)) part++;
    else { fail++; const k=(ors[0].category||"(미분류)"); cats.set(k,(cats.get(k)||0)+1); }
  }
  rs.forEach(r=>{ const p=pcOf(r); pcsM.set(p,(pcsM.get(p)||0)+1); });
  const human=new Set(rs.filter(r=>r.human_action||r.human_reason_cat).map(r=>r.order_id)).size;
  return {orders:orders.size,tries:rs.length,done,part,fail,cats,human,pcs:pcsM};
}
function dailyStats(list){
  const byDay=new Map();
  for(const r of list){ const d=dayOf(r); if(!d) continue; if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(r); }
  const out=[];
  for(const [day,rs] of byDay){
    const w=new Date(day+"T00:00:00"); const wd=["일","월","화","수","목","금","토"][isNaN(w)?0:w.getDay()];
    out.push(Object.assign({day,wd},orderStats(rs)));
  }
  return out.sort((a,b)=>a.day<b.day?1:-1);
}

    <dt>실패</dt><dd><span class="tag fail">${esc(r.category||"미분류")}</span> <span class="muted">${esc(r.reason||"")}</span></dd>
  </dl>` }
// 사유 드롭다운 — AI 추천 분류(suggest_cat)가 있으면 기본 선택 (담당자는 틀리면 바꾸기만)
function reasonSelect(id, suggested){return `<select id="rc-${id}"><option value="">사유 분류 선택 (필수)</option>${REASONS.map(([v,l])=>`<option value="${v}" ${v===suggested?"selected":""}>${l}${v===suggested?" (AI 추천)":""}</option>`).join("")}</select>`}
function cardTodo(r){ const id=Number(r.id); return `<div class="card" id="c-${id}">${head(r)}
  <div class="row"><span class="small muted">${r.state==="human_takeover"?"<b>개입한 주문</b> — 폰 A 화면을 이어서 주문한 뒤:":PARTIAL(r)?"디바이스 A 로 <b>음료만</b> 추가 주문 후:":"담당자가 디바이스 A 로 직접 주문 후:"}</span>
    <button class="ok" onclick="done(${id})">주문완료</button>
    <input id="note-${id}" type="text" placeholder="(선택) OO점에서 됨 / 검색은 XX로">
  </div>
  <div class="row">${reasonSelect(id, r.suggest_cat)}<input id="fnote-${id}" type="text" placeholder="(기타면) 한 줄"><button class="bad" onclick="fail(${id})">주문실패</button></div></div>`}
function cardReason(r){ const id=Number(r.id); return `<div class="card" id="c-${id}">${head(r)}<div class="row">${reasonSelect(id, r.suggest_cat)}<input id="fnote-${id}" type="text" placeholder="한 줄 (배민 이름 / 되는 지점 / 주문자 오류 등)"><button class="ok" onclick="saveReason(${id})">저장</button></div></div>`}
function cardQ(q){ const id=Number(q.id); return `<div class="card" id="q-${id}"><div class="head"><b>${esc(q.topic)}</b> <span class="tag">${esc(q.pc_id)}</span></div><div class="reason" style="white-space:pre-wrap;color:var(--fg)">${esc(q.question)}</div>
  <div class="row"><textarea id="ans-${id}" rows="2" placeholder='예: 배민에선 "맛초킹 순살" / 그 지점엔 없음, 충무로역점 / 주문자 오류'></textarea><button class="ok" onclick="answer(${id})">답 저장</button></div></div>`}

// ★ 수기 개입 (주인님 2026-09-09): 담당자가 누르면 허브 pcs.takeover_order 에 주문번호가 적히고, 배치가 5초 안에 그 자리에서 멈춘다.
//   폰 화면은 그대로 남고, AI 는 담당자가 그 주문 카드에서 주문완료/실패를 저장할 때까지 기다린다(저장하면 자동 해제).
async function takeover(pc, orderId){ if(!needName()) return;
  if(!confirm(`[수기 배달로 넘기기] ${orderId}\nAI 가 지금 화면에서 즉시 멈추고, 이 주문은 담당자가 폰 A 로 이어서 넣습니다.\n녹화는 나중에 분석용으로 저장됩니다. 넘길까요?`)) return;
  try{ const upd=await patch("pcs","pc_id=eq."+enc(pc)+"&takeover_order=is.null",{takeover_order:String(orderId),takeover_by:me(),takeover_at:new Date().toISOString()});
    if(!upd.length) toast("이미 개입 요청이 있거나 PC 를 못 찾음 — 새로고침",true); else toast("개입 요청됨 — AI 가 5초 안에 멈춥니다. 폰 A 화면을 이어서 조작하세요",true);
    load(false); }catch(e){ toast("개입 요청 실패: "+errText(e),true) } }
async function resumeAI(pc){ if(!needName()) return;
  try{ await patch("pcs","pc_id=eq."+enc(pc),{takeover_order:null,takeover_by:null,takeover_at:null}); toast("AI 재개"); load(false); }catch(e){ toast("재개 실패: "+errText(e),true) } }
async function clearTakeover(orderId){ try{ await patch("pcs","takeover_order=eq."+enc(orderId),{takeover_order:null,takeover_by:null,takeover_at:null}); }catch(e){} }
// 쓰기 — 주문 단위(order_id)로 모든 시도행을 한 번에 닫고, 0행이면 남이 먼저 처리한 것
async function done(id){ const r=byId(id); if(!r) return; if(!needName()) return;
  if(!confirm(`[주문완료] ${r.order_id} · ${r.brand} · ${r.hotel||""}\n이 주문이 배민에 들어갔습니까?`)) return;
  try{ const upd=await patch("order_reports","order_id=eq."+enc(r.order_id)+"&human_action=is.null",{human_action:"주문완료",human_by:me(),human_note:(($("#note-"+id)||{}).value||"").trim()||null,human_at:new Date().toISOString(),state:"human_done"});
    if(!upd.length){ toast("이미 다른 담당자가 처리했거나 건이 사라짐 — 이 주문을 다시 불러왔습니다",true); await reloadOrder(r.order_id); }
    else { toast("주문완료 기록됨 — 어드민 매핑은 실전 전환 전까지 채팅으로 AI 에게 요청"); mergeRows(upd); clearTakeover(r.order_id); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }
async function fail(id){ const r=byId(id); if(!r) return; if(!needName()) return; const cat=(($("#rc-"+id)||{}).value||""); if(!cat) return toast("사유 분류를 골라주세요 (필수)");
  if(!confirm(`[주문실패] ${r.order_id} · ${r.brand} · ${r.hotel||""}\n사유: ${cat}\n정말 주문실패로 기록할까요? (어드민 취소·환불 단계로 넘어갑니다)`)) return;
  try{ const upd=await patch("order_reports","order_id=eq."+enc(r.order_id)+"&human_action=is.null",{human_action:"주문실패",human_by:me(),human_reason_cat:cat,who_wrong:WHO[cat]||"AI",human_note:(($("#fnote-"+id)||{}).value||"").trim()||null,human_at:new Date().toISOString(),state:"human_failed"});
    if(!upd.length){ toast("이미 다른 담당자가 처리했거나 건이 사라짐 — 이 주문을 다시 불러왔습니다",true); await reloadOrder(r.order_id); }
    else { toast("주문실패 + 사유 기록됨 — 어드민 취소는 실전 전환 전까지 직접/채팅으로"); mergeRows(upd); clearTakeover(r.order_id); refreshBacklogCount(); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }
async function saveReason(id){ const r=byId(id); if(!r) return; if(!needName()) return; const cat=(($("#rc-"+id)||{}).value||""); if(!cat) return toast("사유 분류를 골라주세요");
  try{ const upd=await patch("order_reports","order_id=eq."+enc(r.order_id)+"&human_reason_cat=is.null",{human_reason_cat:cat,who_wrong:WHO[cat]||"AI",human_by:me(),human_note:(($("#fnote-"+id)||{}).value||"").trim()||null,human_at:new Date().toISOString()});
    if(!upd.length){ toast("이미 다른 담당자가 사유를 달았습니다 — 이 주문을 다시 불러왔습니다",true); await reloadOrder(r.order_id); }
    else { toast("사유 저장 — [교정 반영] 탭에서 수정할 수 있습니다"); mergeRows(upd); refreshBacklogCount(); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }
// ★ 저장 후 수정 (주인님 2026-09-06): 고치면 learned/applied 를 되돌려 AI 가 **다시 학습**하게 한다. 잠금 없이 주문 단위로 덮어쓴다.
async function editReason(id){ const r0=byId(id); if(!r0) return; const r=full(r0); if(!needName()) return;
  if(!details.has(id)) return toast("메모를 아직 불러오는 중입니다 — 잠시 후 다시 눌러주세요");   // 메모(상세)가 없는 채로 저장하면 기존 메모가 지워진다
  const cat=(($("#erc-"+id)||{}).value||""), noteDirty=dirty.has("enote-"+id), note=(($("#enote-"+id)||{}).value||"").trim();
  if(cat===(r.human_reason_cat||"") && (!noteDirty || note===(r.human_note||""))) return toast("바뀐 내용이 없습니다");
  // 사유를 비우면 메모만 고친다(사유·틀린쪽은 그대로). 메모는 **손댔을 때만** 보낸다. 잠금: 내가 본 human_at 그대로일 때만 — 남이 먼저 고쳤으면 0행
  const body={human_by:me(),human_at:new Date().toISOString(),learned:false};
  if(noteDirty) body.human_note=note||null;
  if(cat){ body.human_reason_cat=cat; body.who_wrong=WHO[cat]||"AI"; }
  const lock = r.human_at? "&human_at=eq."+enc(r.human_at) : "&human_at=is.null";
  try{ const upd=await patch("order_reports","order_id=eq."+enc(r.order_id)+"&or=(human_reason_cat.not.is.null,human_action.not.is.null)"+lock, body);
    dirty.clear();
    if(!upd.length){ toast("다른 담당자가 먼저 고쳤습니다 — 이 주문을 다시 불러왔습니다",true); await reloadOrder(r.order_id); }
    else { toast("수정 저장 — AI 가 다시 학습합니다(반영 표시 해제)"); mergeRows(upd); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }
async function editAnswer(id){ if(!needName()) return; const q=qs.find(x=>x.id===id); if(!q) return; const a=((($("#eans-"+id)||{}).value)||"").trim(); if(!a) return toast("답을 적어주세요");
  if(a===(q.answer||"")) return toast("바뀐 내용이 없습니다");
  const lock = q.edited_at? "&edited_at=eq."+enc(q.edited_at) : "&edited_at=is.null";
  try{ const upd=await patch("questions","id=eq."+id+lock,{answer:a,answered_by:me(),edited_at:new Date().toISOString(),applied:false});
    dirty.clear();
    if(!upd.length){ toast("다른 담당자가 먼저 고쳤습니다 — 이 질문을 다시 불러왔습니다",true); await reloadQ(id); }
    else { toast("답 수정 — AI 가 다시 반영합니다"); mergeQs(upd); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }
function editReasonBox(r0){ const r=full(r0); const id=Number(r.id); if(!details.has(id)) return `<div class="row small muted">메모 불러오는 중…</div>`; const known=REASONS.some(([v])=>v===r.human_reason_cat);
  return `<div class="row"><select id="erc-${id}"><option value="" ${known?"":"selected"}>${r.human_reason_cat&&!known?`(현재: ${esc(r.human_reason_cat)})`:"(사유 없음 — 메모만)"}</option>${REASONS.map(([v,l])=>`<option value="${v}" ${v===r.human_reason_cat?"selected":""}>${l}</option>`).join("")}</select><input id="enote-${id}" type="text" value="${esc(r.human_note||"")}" placeholder="한 줄"><button class="ok" onclick="editReason(${id})">수정 저장</button></div>` }
async function answer(id){ if(!needName()) return; const a=((($("#ans-"+id)||{}).value)||"").trim(); if(!a) return toast("답을 적어주세요");
  try{ const upd=await patch("questions","id=eq."+id+"&answer=is.null",{answer:a,answered_by:me(),answered_at:new Date().toISOString()});
    if(!upd.length){ toast("이미 다른 담당자가 답했습니다 — 이 질문을 다시 불러왔습니다",true); await reloadQ(id); }
    else { toast("답 저장 — AI 가 다음날 반영"); mergeQs(upd); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render(false)});
$("#refresh").onclick=()=>load(true); $("#pcFilter").onchange=()=>render(false);
document.addEventListener("compositionstart",()=>composing=true); document.addEventListener("compositionend",()=>composing=false);
$("#gateOk").onclick=commitGate; $("#gateName").addEventListener("keydown",e=>{ if(e.key==="Enter") commitGate(); });
$("#meChange").onclick=showGate;
paintMe(); if(!ME) showGate();                       // 세션(이름) 없으면 먼저 받는다 — 데이터는 뒤에서 미리 불러온다
load(true); setInterval(()=>{ if(document.visibilityState==="hidden") return; load(false); }, POLL_MS);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(false); });
</script>
</body>
