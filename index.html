<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배민 자동주문 리포트 어드민</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ee;--dim:#8b93a7;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb347;--acc:#4f8cff}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}header .who{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--dim);flex-wrap:wrap}
  input,select,textarea,button{font:inherit;color:var(--fg);background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  button{cursor:pointer}button.ok{background:var(--ok);color:#052;border-color:var(--ok);font-weight:700}button.bad{background:#3a1c1c;border-color:var(--bad);color:#ffb3b3;font-weight:700}
  nav{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:transparent;border-color:transparent;color:var(--dim);padding:8px 12px;border-radius:8px;white-space:nowrap}nav button.on{background:var(--card);color:var(--fg);border-color:var(--line)}
  main{padding:12px 16px;max-width:1200px;margin:0 auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}.kpi b{font-size:22px;display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .card .head{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}.card .head b{font-size:15px}.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:#22283a;color:var(--dim)}
  .tag.fail{background:#3a1c1c;color:#ffb3b3}.tag.ok{background:#173a2a;color:#9ff0c6}.tag.need{background:#3a2f14;color:#ffd58a}.tag.part{background:#1c2a3a;color:#9fd0ff}
  .reason{color:var(--dim);font-size:12px;margin:6px 0;word-break:break-all}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row>*{flex:0 0 auto}.row textarea,.row input[type=text]{flex:1 1 220px;min-width:180px}
  .muted{color:var(--dim)}.small{font-size:12px}.empty{color:var(--dim);padding:24px;text-align:center}
  .banner{border:1px solid var(--bad);background:#2a1616;color:#ffb3b3;border-radius:8px;padding:8px 12px;margin-bottom:10px}
  .group{color:var(--dim);font-size:12px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--dim);font-weight:600;white-space:nowrap}
  table.wide{min-width:1150px}td.nw{white-space:nowrap}.tag{white-space:nowrap}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#22283a;border:1px solid var(--line);padding:8px 14px;border-radius:8px;display:none;max-width:90vw;z-index:9}
  .toast.err{border-color:var(--bad);background:#2a1616;color:#ffb3b3}
  /* 카드 정보 줄 — 라벨:값 (태그 나열 금지, 주인님 2026-09-06) */
  .info{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:13px;margin:8px 0 4px}
  .info dt{color:var(--dim);white-space:nowrap}.info dd{margin:0;word-break:break-all}.info dd b{color:var(--acc)}
  .who{font-size:12px;color:var(--dim)}
  .explain{background:#1c2a3a;border:1px solid #27406a;border-radius:8px;padding:8px 10px;margin:8px 0 2px;font-size:13px;line-height:1.5}
  .explain b{color:#9fd0ff}
  /* 이름 게이트 — 세션(이름)이 없으면 먼저 받는다 */
  #gate{position:fixed;inset:0;background:rgba(10,12,16,.92);display:none;place-items:center;z-index:50}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px;width:min(92vw,420px)}
  #gate h2{margin:0 0 6px;font-size:18px}#gate p{margin:0 0 14px;color:var(--dim);font-size:13px}
  #gate input{width:100%;font-size:16px;padding:10px 12px;margin-bottom:10px}#gate button{width:100%;padding:10px}
</style>
</head>
<body>
<header>
  <h1>배민 자동주문 리포트 어드민</h1>
  <span class="tag" id="hubTag">허브 연결 중…</span>
  <div class="who">
    <span class="small">👤 <b id="meName">—</b> <button id="meChange" class="small" style="padding:2px 8px">바꾸기</button></span>
    <label class="small">PC <select id="pcFilter"><option value="">전체</option></select></label>
    <button id="refresh">새로고침</button>
    <a href="guide.html" target="_blank" class="tag" style="text-decoration:none;padding:6px 10px">📘 가이드</a>
    <a href="failure-guide.pdf" target="_blank" class="tag" style="text-decoration:none;padding:6px 10px" title="AI 가 못 한 주문을 정리하는 방법 (인쇄용)">📕 정리 가이드 PDF</a>
  </div>
</header>
<nav>
  <button data-tab="todo" class="on">지금 할 일 <span id="nTodo" class="tag need">0</span></button>
  <button data-tab="today">오늘 현황</button>
  <button data-tab="daily">일별 통계</button>
  <button data-tab="reasons">실패 사유 입력 <span id="nReasons" class="tag">0</span></button>
  <button data-tab="questions">미답변 질문 <span id="nQ" class="tag">0</span></button>
  <button data-tab="learned">교정 반영</button>
</nav>
<main id="main"><div class="empty">허브에서 불러오는 중…</div></main>
<div class="toast" id="toast"></div>
<div id="gate"><div class="box">
  <h2>담당자 이름을 알려주세요</h2>
  <p>이 브라우저에 처음 오셨습니다. 여기서 누르는 버튼·적는 사유와 답에 이름이 남습니다 (AI 가 "누가 알려줬는지" 를 기록합니다).</p>
  <input id="gateName" type="text" placeholder="이름 (예: 홍길동)" autocomplete="off">
  <select id="gatePc" style="width:100%;margin-bottom:10px"><option value="">내 PC (선택 — 현황에 이름을 붙이려면 골라주세요)</option></select>
  <button class="ok" id="gateOk">시작하기</button>
</div></div>
<script>
// ── 허브 접속 (publishable 키 = Supabase 가 "공개해도 안전" 으로 명시한 공개용 키. 비밀키 아님) ──
const HUB_URL = "https://cgpdxysokoupymsnvpzk.supabase.co";
const HUB_KEY = "sb_publishable_KOS_oSZXAEXa17wc4SDroQ_2D-iEkpL";
const H = {"apikey":HUB_KEY,"Authorization":"Bearer "+HUB_KEY,"Content-Type":"application/json"};
const WINDOW_DAYS = 90;      // 백로그·교정·통계 창 (사유 백로그가 이 안에 있다 — 줄이면 담당자가 입력할 수단이 사라진다)
const LIVE_DAYS   = 3;       // 폴링 창 — 최근 3일 전체 + 사람 몫(날짜 무관)만 60초마다
const POLL_MS     = 60000;
const TIMEOUT_MS  = 15000;
// ★ egress 폭증(2026-09-09 실측 18.6GB/일): 30초마다 90일 전량(select=*, 2,357행×923B=2.17MB)을 세 탭이 받았다.
//   → 폴링은 "최근 3일 ∪ 사람 몫" 만, 목록 컬럼만(select 목록), 큰 글(ai_explain·reason·주소 근거)은 카드에 보일 때 그 행만.
//   90일 창은 탭을 열 때(백로그·교정·통계·지난 날짜 현황)만 받고 10분 캐시. 저장 후엔 PATCH 응답 행을 그대로 머지(재조회 0회).
const COLS = "id,order_id,pc_id,brand,store,hotel,menu,result,state,category,attempts,started_at,created_at,total_sec,baemin_no,human_action,human_reason_cat,human_by,human_at,learned,who_wrong,suggest_cat";
const DETAIL_COLS = "id,ai_explain,reason,addr_given,addr_query,addr_picked,store_query,human_note,case_key";
const QCOLS = "id,pc_id,topic,question,answer,answered_by,answered_at,applied,edited_at,created_at";
const HIST_TTL = 10*60000;
// PostgREST 는 한 번에 1,000행 — 다 받을 때까지 이어 받는다
async function get(path, signal){ let out=[], lo=0; for(;;){ const r=await fetch(HUB_URL+"/rest/v1/"+path,{headers:{...H,"Range":lo+"-"+(lo+999)},signal}); if(!r.ok) throw new Error(r.status+" "+await r.text()); const b=await r.json(); out=out.concat(b); if(b.length<1000) return out; lo+=1000; } }
// 쓰기: 조건(match)에 맞는 행만 바꾸고, 바뀐 행을 돌려받는다 — 0행이면 "이미 남이 처리" 로 판정 (낙관적 잠금)
async function patch(table, match, body){ const r=await fetch(HUB_URL+"/rest/v1/"+table+"?"+match,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)}); if(!r.ok) throw new Error(r.status+" "+await r.text()); const res=await r.json(); return Array.isArray(res)?res:[]; }
// 개수만 (본문 0바이트): Range 0-0 + count=exact → Content-Range "0-0/1427"
async function count(path, signal){ const r=await fetch(HUB_URL+"/rest/v1/"+path,{headers:{...H,"Range":"0-0","Prefer":"count=exact"},signal}); if(!r.ok) throw new Error(r.status+" "+await r.text()); const cr=r.headers.get("Content-Range")||""; const m=/\/(\d+)$/.exec(cr); return m?+m[1]:0; }
function errText(e){ if(e&&e.name==="AbortError") return "허브 응답 없음(15초) — 네트워크 확인"; const m=/^(\d{3})/.exec((e&&e.message)||""); if(m){ const c=+m[1]; if(c===401||c===403) return "권한 오류("+c+") — 키/정책 확인"; if(c>=500) return "허브 서버 오류("+c+")"; return "허브 오류("+c+")"; } return (navigator.onLine===false)?"오프라인 — 네트워크 확인":"연결 실패: "+((e&&e.message)||e); }

// ── 사유 분류 (PROCESS §2 표 그대로) ──
const REASONS = [
  ["매장없음","매장 없음 (영업안함/폐업)"],
  ["매장에메뉴없음","매장에 메뉴 없음"],
  ["이름다름","메뉴 이름이 달라서 못 찾음"],
  ["최소주문","최소주문 미달 / 금액 불일치"],
  ["주소AI실패","주소/호텔 못 찾음 — AI 가 못 찾음 (호텔은 실재)"],
  ["주소주문자오류","주소/호텔 못 찾음 — 주문자가 잘못 적음"],
  ["주문자오류","주문자 오류 (메뉴명 오타 등)"],
  ["기타","기타 (한 줄 설명)"],
];
const WHO = {"주소주문자오류":"주문자","주문자오류":"주문자"};
// 사람이 사유를 달아도 학습이 안 되는 분류 (hub_shipper.NOT_LEARNABLE 와 같게) — 사유 입력 목록에서 뺀다
const NOT_LEARNABLE = new Set(["매장영업시간","앱진입","인프라(폰/adb)","결제버튼못찾음","금액가드","매장문맥","코드오류"]);
// 부분 = 실전에서 치킨은 넣었고 음료만 담당자 몫. 연습 모드의 '(부분·연습)' 은 손님이 이미 받은 주문이라 담당자 일이 아니다
//   (2026-09-09 주인님: 9/8 연습 주문 41800 이 '지금 할 일' 에 떠 있었다) → 정확히 '음료단품없음(부분)' 만.
const PARTIAL = r => String(r.category||"")==="음료단품없음(부분)";
const STATE_KO = {human_needed:"파킹 — 직접 주문", store_cancelled:"매장 취소", ai_failed:"AI 실패", ai_success:"AI 완주", human_done:"담당자 완료", human_failed:"담당자 실패", mapped:"매핑됨", cancelled:"취소됨"};

let rows=[], qs=[], qsLite=[], tab="todo", viewDay="";        // viewDay: 현황 탭에서 보는 날짜 (빈값=오늘)
let live=[], hist=[], histAt=0, qsAt=0, nReasonsSrv=null;      // live: 폴링(3일∪사람몫) · hist: 90일(탭 열 때) · rows = hist ⊕ live
const details=new Map();                                        // id → {ai_explain, reason, addr_*, store_query, human_note, case_key}
let detailsBusy=false, histBusy=false, qsBusy=false, dataSeq=0;   // dataSeq: 머지가 일어나면 +1 — 그 전에 떠난 조회 응답은 버린다(경주 방지)
const sig = ms => (typeof AbortSignal!=="undefined" && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;
// 사람 몫(B) 판정 — 서버 B 쿼리와 같은 조건. 폴링 후 이 조건인데 B 에 없는 hist 행은 남이 닫은 것 → 버린다
const isHumanNeeded = r => !r.human_action && (r.state==="human_needed"||r.state==="store_cancelled"||PARTIAL(r));
function rebuildRows(){ const m=new Map(); for(const r of hist) m.set(r.id,r); for(const r of live) m.set(r.id,r); rows=[...m.values()].sort((a,b)=>(tsOf(b)-tsOf(a))||(b.id-a.id)); }
const full = r => details.has(r.id)? Object.assign({}, r, details.get(r.id)) : r;
// 저장 응답(return=representation: 전 컬럼)을 그대로 머지 — 재조회 없이 화면·배지 갱신
function mergeRows(upd){ dataSeq++; seq++; if(ctrl) ctrl.abort();      // 진행 중이던 폴링·조회 응답은 버린다(저장 직전 스냅샷이 저장을 되돌리는 경주)
  for(const u of upd){ if(!u||u.id==null) continue; const d={}; for(const k of DETAIL_COLS.split(",")) if(k!=="id" && k in u) d[k]=u[k]; if(Object.keys(d).length) details.set(u.id, Object.assign(details.get(u.id)||{}, d));
    const slim={}; for(const k of COLS.split(",")) if(k in u) slim[k]=u[k];
    let hit=false; live=live.map(r=>r.id===u.id?(hit=true,Object.assign({},r,slim)):r); hist=hist.map(r=>r.id===u.id?(hit=true,Object.assign({},r,slim)):r); if(!hit) live.push(slim); }
  rebuildRows(); }
function mergeQs(upd){ dataSeq++; for(const u of upd){ if(!u||u.id==null) continue; qs=qs.map(q=>q.id===u.id?Object.assign({},q,u):q); let hit=false; qsLite=qsLite.map(q=>q.id===u.id?(hit=true,Object.assign({},q,{answer:u.answer,applied:u.applied})):q); if(!hit) qsLite.push({id:u.id,answer:u.answer,applied:u.applied}); } }
let loadedOnce=false, lastOkAt=null, lastErr=null, seq=0, ctrl=null, composing=false, lastSnap="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
// 담당자 이름 = 이 브라우저의 세션. 없으면 게이트로 먼저 받는다 (주인님 2026-09-06: 누가 적었는지 알아야 한다)
let ME="", MYPC="", pcs={};                      // pcs: {pc_id: monitor} — PC↔담당자 짝 (허브 pcs 표)
try{ ME=(localStorage.getItem("me")||"").trim(); MYPC=(localStorage.getItem("mypc")||"").trim(); }catch(e){}
const me=()=>ME||"담당자";
function needName(){ if(ME) return true; showGate(); toast("담당자 이름을 먼저 적어주세요"); return false; }
function setInert(on){ for(const sel of ["main","header","nav"]){ const el=document.querySelector(sel); if(el) el.inert=on; } }
function showGate(){ $("#gateName").value=ME; const sel=$("#gatePc"); const cur=MYPC;
  sel.innerHTML='<option value="">내 PC (선택 — 현황에 이름을 붙이려면 골라주세요)</option>'+[...new Set(rows.map(pcOf))].sort().map(p=>`<option value="${esc(p)}" ${p===cur?"selected":""}>${esc(p)}${(pcs[p]||{}).monitor?` — 지금 ${esc(pcs[p].monitor)}`:""}</option>`).join("");
  $("#gate").style.display="grid"; setInert(true); setTimeout(()=>$("#gateName").focus(),50); }
function paintMe(){ $("#meName").textContent=(ME||"—")+(MYPC?` @${MYPC}`:""); }
async function commitGate(){ const v=($("#gateName").value||"").trim(); if(v.length<2) return toast("이름을 2자 이상 적어주세요");
  ME=v; MYPC=($("#gatePc").value||"").trim(); try{localStorage.setItem("me",ME); localStorage.setItem("mypc",MYPC)}catch(e){}
  paintMe(); $("#gate").style.display="none"; setInert(false);
  try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission(); }catch(e){}
  if(MYPC){ try{ await fetch(HUB_URL+"/rest/v1/pcs",{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{pc_id:MYPC,monitor:ME,updated_at:new Date().toISOString()}])}); pcs[MYPC]=Object.assign(pcs[MYPC]||{},{monitor:ME}); }catch(e){ toast("PC 담당자 저장 실패: "+errText(e),true) } }
  render(false); }
const whoOf = r => r.human_by || (pcs[pcOf(r)]||{}).monitor || "";
// ── AI 가 지금 하는 일 (허브 pcs 표: 발송기가 60초마다 갱신) — "지금 할 일"(사람 몫)과 구분해서 보여준다
function ago(iso){ const t=new Date(iso); if(isNaN(t)) return ""; const m=Math.round((Date.now()-t.getTime())/60000); return m<1?"방금":m+"분째"; }
function liveStrip(){ const ps=Object.values(pcs); if(!ps.length) return "";
  const items=ps.map(p=>{ const stale=p.updated_at && (Date.now()-new Date(p.updated_at).getTime())>3*60000;
    let s; if(stale) s=`<span class="tag fail">연결 끊김</span> ${ago(p.updated_at)} 전 소식`;
    else if(!p.batch_alive) s=`<span class="tag">배치 꺼짐</span>`;
    else if(p.current_order) s=`<b>${esc(p.current_order)}</b> ${esc(p.current_brand||"")} · ${esc(p.current_step||"")} · ${ago(p.current_since)}`;
    else s=`<span class="tag ok">대기 중</span> 다음 주문 준비`;
    return `<div><span class="muted">🤖 ${esc(p.pc_id)}${p.monitor?` (${esc(p.monitor)})`:""}</span> — ${s}</div>`; });
  return `<div class="card" style="background:#12161f"><b class="small muted">AI 가 지금 하는 일</b>${items.join("")}</div>`; }
// ── 새 "직접 주문" 카드가 생기면 알림: 소리 + 브라우저 알림 + 탭 제목 숫자 (주인님 2026-09-06: "실패한 거 띄우는 건 팝업이야?")
let seenTodo=null, baseTitle=document.title;
const dirty=new Set();                                   // 사용자가 실제로 손댄 입력 id — 재그리기 때 이것만 복원
document.addEventListener("input",e=>{ if(e.target&&e.target.id&&document.getElementById("main").contains(e.target)) dirty.add(e.target.id); });
document.addEventListener("change",e=>{ if(e.target&&e.target.id&&document.getElementById("main").contains(e.target)) dirty.add(e.target.id); });
function beep(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.value=0.15; o.start(); setTimeout(()=>{o.frequency.value=1175},150); setTimeout(()=>{o.stop(); ac.close()},400); }catch(e){} }
function notifyNew(todo){ const ids=new Set(todo.map(r=>r.order_id)); document.title=(todo.length?`(${todo.length}) `:"")+baseTitle;
  if(seenTodo===null){ seenTodo=ids; return; }
  const fresh=todo.filter(r=>!seenTodo.has(r.order_id)); seenTodo=ids; if(!fresh.length) return;
  beep(); const r=fresh[0]; const msg=`직접 주문 필요 ${fresh.length}건 — ${r.brand} ${r.store||""} · ${r.hotel||""} (${r.order_id})`;
  toast("🔔 "+msg,true);
  try{ if("Notification" in window && Notification.permission==="granted") new Notification("배민 리포트 어드민", {body:msg}); }catch(e){} }

let toastTimer=null;
function toast(m, sticky){ const t=$("#toast"); t.textContent=m; t.className="toast"+(sticky?" err":""); t.style.display="block"; clearTimeout(toastTimer); if(!sticky) toastTimer=setTimeout(()=>t.style.display="none",2500); }
// 날짜는 전부 이 PC 의 현지(한국) 기준. started_at 은 저널 현지시각(tz 없음 → 브라우저가 현지로 해석), created_at 은 허브 UTC(+00:00 붙음)
function tsOf(r){ if(r.started_at){ const d=new Date(r.started_at); if(!isNaN(d)) return d.getTime(); } const d=new Date(r.created_at||0); return isNaN(d)?0:d.getTime(); }
function localDay(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayStr(){return localDay(new Date())}
function dayOf(r){ const t=tsOf(r); return t? localDay(new Date(t)) : "" }
function timeOf(r){ const t=tsOf(r); if(!t) return ""; const d=new Date(t); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") }
function hhmm(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") }
function durText(sec){ sec=Math.round(+sec||0); if(!sec) return ""; const m=Math.floor(sec/60), s=sec%60; return m? `${m}분 ${s}초` : `${s}초`; }
function endOf(r){ const t=tsOf(r); if(!t||!r.total_sec) return ""; return hhmm(new Date(t+Math.round(+r.total_sec)*1000)); }
// 현황 표의 시각 셀: 날짜 · 시작 → 종료 · 소요 (주인님 2026-09-06: "주문별 날짜·시작·종료·얼마나 걸렸는지")
function whenCell(r){ const d=dayOf(r), st=timeOf(r), en=endOf(r), du=durText(r.total_sec); return `<span class="muted">${esc(d.slice(5))}</span> <b>${esc(st)}</b>${en?` → ${esc(en)}`:""}${du?` <span class="muted">· ${esc(du)}</span>`:""}`; }
function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString() }
function pcOf(r){return (r.pc_id||"").trim()||"?"}
function filtered(){const pc=$("#pcFilter").value;return rows.filter(r=>!pc||pcOf(r)===pc)}
// 같은 어드민 주문이 여러 번 시도됐으면 최신 한 건만 (rows 는 시도시각 내림차순으로 정렬돼 있음)
function latestPerOrder(list){ const seen=new Set(), out=[]; for(const r of list){ if(seen.has(r.order_id)) continue; seen.add(r.order_id); out.push(r);} return out }
const byId = id => rows.find(r=>r.id===id);

async function load(force){
  const my=++seq; if(ctrl) ctrl.abort(); ctrl=new AbortController(); const sig=ctrl.signal; const to=setTimeout(()=>ctrl.abort(), TIMEOUT_MS);
  try{
    // A) 최근 3일 전체  B) 사람 몫(파킹·매장취소·부분) — 날짜 무관 (todo 계약: 어제 파킹건도 보여야 한다)
    const [a,b,q1,p1]=await Promise.all([
      get("order_reports?select="+COLS+"&created_at=gte."+enc(isoDaysAgo(LIVE_DAYS))+"&order=id.desc", sig),
      get("order_reports?select="+COLS+"&human_action=is.null&or=(state.eq.human_needed,state.eq.store_cancelled,category.eq."+enc("음료단품없음(부분)")+")&order=id.desc", sig),
      get("questions?select=id,answer,applied&order=id.desc", sig),
      get("pcs?select=*", sig).catch(()=>[])]);
    if(my!==seq) return;                                       // 더 최근 load 가 있으면 이 응답은 버림
    pcs={}; for(const p of p1) if(p.pc_id) pcs[p.pc_id]=p;
    const seen=new Set(); live=a.concat(b).filter(r=>!seen.has(r.id)&&seen.add(r.id));
    const bIds=new Set(b.map(r=>r.id)); hist=hist.filter(r=>!(isHumanNeeded(r)&&!bIds.has(r.id)));   // B 가 이 집합의 정답
    if(force){ details.clear(); qsAt=0; }                     // 수동 새로고침·충돌 때 큰 글 캐시는 버린다(남이 고친 메모가 남아 덮어쓰는 사고 방지)
    rebuildRows(); qsLite=q1; loadedOnce=true; lastOkAt=new Date(); lastErr=null;
    const qk=a2=>a2.map(q=>q.id+":"+(q.answer?1:0)+(q.applied?1:0)).sort().join("|"); if(qs.length && qk(qsLite)!==qk(qs)) qsAt=0;   // 새 질문·남의 답이 보이면 본문도 다시
    if(force || nReasonsSrv===null) refreshBacklogCount();
    if(hist.length===0 && !histBusy) ensureHist();              // 90일 목록은 **페이지당 1회**(첫 로드) — 배지를 주문 단위로 정확히. 새로고침·충돌엔 안 받는다
    $("#hubTag").textContent="허브 연결됨 · 최근 "+LIVE_DAYS+"일 "+live.length+"건 · 질문 "+qsLite.length+" · "+hhmm(lastOkAt); $("#hubTag").className="tag ok";
    const pcList=[...new Set(rows.map(pcOf))].sort(); const sel=$("#pcFilter"); const cur=sel.value;
    sel.innerHTML='<option value="">전체</option>'+pcList.map(p=>`<option value="${esc(p)}" ${p===cur?"selected":""}>${esc(p)}</option>`).join("");
  }catch(e){ if(my!==seq) return; lastErr=errText(e); $("#hubTag").textContent=lastErr; $("#hubTag").className="tag fail"; }
  finally{ clearTimeout(to); }
  render(!force);
}
// 사유 백로그 개수만 (본문 0바이트) — 90일 데이터를 안 받은 상태의 배지용
async function refreshBacklogCount(){ try{ const n=await count("order_reports?select=id&result=eq."+enc("실패")+"&human_reason_cat=is.null&human_action=is.null&created_at=gte."+enc(isoDaysAgo(WINDOW_DAYS))+"&category=not.in.("+[...NOT_LEARNABLE].map(x=>enc('"'+x+'"')).join(",")+")"); nReasonsSrv=n; if(hist.length===0) $("#nReasons").textContent=n; }catch(e){} }
// 90일 목록(컬럼만) — 백로그·교정 반영·일별 통계·지난 날짜 현황을 열 때만. 10분 캐시. 저장은 머지로 반영되므로 재조회 없음.
async function ensureHist(){ if(histBusy || Date.now()-histAt<HIST_TTL) return; histBusy=true; const my=dataSeq;
  try{ const r=await get("order_reports?select="+COLS+"&created_at=gte."+enc(isoDaysAgo(WINDOW_DAYS))+"&order=id.desc", sig(TIMEOUT_MS*3)); if(my!==dataSeq) return; hist=r; histAt=Date.now(); rebuildRows(); render(true); }
  catch(e){ toast("90일 데이터 불러오기 실패: "+errText(e),true) } finally{ histBusy=false; } }
// 질문 본문 — 미답변 질문·교정 반영 탭을 열 때만
async function ensureQs(){ if(qsBusy || Date.now()-qsAt<HIST_TTL) return; qsBusy=true;
  try{ const r=await get("questions?select="+QCOLS+"&order=id.desc", sig(TIMEOUT_MS)); qs=r; qsAt=Date.now(); render(true); }
  catch(e){ toast("질문 불러오기 실패: "+errText(e),true) } finally{ qsBusy=false; } }
// 카드에 보이는 행의 큰 글(왜 실패했나·에러 원문·주소 근거) — 그 행들만, 한 번 받으면 캐시
async function ensureDetails(ids){ const need=ids.filter(id=>!details.has(id)); if(!need.length || detailsBusy) return; detailsBusy=true; const my=dataSeq;
  try{ for(let i=0;i<need.length;i+=100){ const chunk=need.slice(i,i+100); const r=await get("order_reports?select="+DETAIL_COLS+"&id=in.("+chunk.join(",")+")", sig(TIMEOUT_MS)); if(my!==dataSeq) return; for(const d of r){ const {id,...rest}=d; details.set(id,rest); } for(const id of chunk) if(!details.has(id)) details.set(id,{}); } render(true); }
  catch(e){} finally{ detailsBusy=false; } }
const histFresh = () => hist.length>0 && Date.now()-histAt<HIST_TTL;     // 10분 캐시 (탭을 다시 열면 그때 갱신)
// 충돌(0행) 때는 그 주문만 다시 받는다 — 90일 전량 재조회 금지
async function reloadOrder(orderId){ try{ const r=await get("order_reports?select="+COLS+","+DETAIL_COLS.replace(/^id,/,"")+"&order_id=eq."+enc(orderId), sig(TIMEOUT_MS)); dataSeq++; for(const u of r){ const d={}; for(const k of DETAIL_COLS.split(",")) if(k!=="id"&&k in u) d[k]=u[k]; details.set(u.id,d); } mergeRows(r); }catch(e){} render(false); }
async function reloadQ(id){ try{ const r=await get("questions?select="+QCOLS+"&id=eq."+id, sig(TIMEOUT_MS)); mergeQs(r); }catch(e){} render(false); }
function counts(){
  const f=filtered(), today=todayStr();
  // 처리 판정은 **주문 단위** — 어느 시도행에든 담당자 입력이 있으면 그 주문은 처리된 것
  const acted=new Set(f.filter(r=>r.human_action).map(r=>r.order_id));
  const labeled=new Set(f.filter(r=>r.human_reason_cat).map(r=>r.order_id));
  const solved=new Set(f.filter(r=>r.result==="완주"&&!PARTIAL(r)).map(r=>r.order_id));   // 부분(음료 빠짐)은 아직 일
  const latest=latestPerOrder(f);
  // 지금 할 일 = AI 가 손 뗀 것만 (파킹·매장취소·부분). AI 재시도 중(ai_failed)은 이중주문 위험이라 안 띄움. 날짜 무관(어제 파킹건도)
  const todo=latest.filter(r=>!acted.has(r.order_id)&&!solved.has(r.order_id)&&(r.state==="human_needed"||r.state==="store_cancelled"||PARTIAL(r)));
  // 사유 입력 = 학습이 되는 실패 중 사유 없는 것 (백로그 — 틈날 때)
  const reasons=latest.filter(r=>r.result==="실패"&&!labeled.has(r.order_id)&&!acted.has(r.order_id)&&!solved.has(r.order_id)&&!NOT_LEARNABLE.has(r.category||""));
  $("#nTodo").textContent=todo.length; $("#nReasons").textContent=(hist.length? reasons.length : (nReasonsSrv??"…")); $("#nQ").textContent=qsLite.filter(q=>!q.answer).length;
  if(loadedOnce) notifyNew(todo);
  return {f,today,todo,reasons,latest};
}
function render(auto){
  const m=$("#main");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const {f,today,todo,reasons}=counts();
  // 자동 새로고침은 입력 중(포커스·한글 조합 중)이면 건너뛴다 — 배지·연결표시만 갱신
  const typing=(document.activeElement&&m.contains(document.activeElement))||composing;
  // 탭이 필요로 하는 데이터를 뒤에서 채운다 (90일 목록·질문 본문·카드 큰 글) — 채워지면 render 가 다시 불린다
  const needHist = tab==="reasons" || tab==="learned" || tab==="daily" || (tab==="today" && viewDay && viewDay!==today);
  if(needHist && !histFresh()) ensureHist();
  if(tab==="questions" || tab==="learned") ensureQs();
  const snap=JSON.stringify([tab,$("#pcFilter").value,lastErr,loadedOnce,rows.length,qs.length,details.size,histAt,
    rows.slice(0,600).map(r=>[r.id,r.human_action,r.human_reason_cat,r.learned,r.state,r.human_by,r.human_at]), qs.map(q=>[q.id,q.answer,q.applied,q.edited_at])]);
  if(auto&&(typing||snap===lastSnap)) return;
  lastSnap=snap;
  // 다시 그려도 입력값은 살린다 (id 기준)
  const saved=new Map([...m.querySelectorAll("input,textarea,select")].filter(el=>dirty.has(el.id)).map(el=>[el.id,el.value]));
  let html="";
  if(!loadedOnce){ m.innerHTML=`<div class="banner"><b>허브에 연결하지 못했습니다</b> — ${esc(lastErr||"불러오는 중…")}<br><span class="small">네트워크(VPN 불필요)·주소를 확인하고 [새로고침]</span></div>`; return; }
  if(lastErr) html+=`<div class="banner">허브 오류: ${esc(lastErr)} · 아래는 <b>${hhmm(lastOkAt)}</b> 기준 데이터입니다 — 버튼은 저장이 안 될 수 있음</div>`;
  if(needHist && !hist.length) html+=`<div class="card muted small">최근 ${WINDOW_DAYS}일 데이터를 불러오는 중… (이 탭은 열 때만 받습니다)</div>`;
  if(tab==="todo"){ ensureDetails(todo.slice(0,200).map(r=>r.id));
    const now=todo.filter(r=>dayOf(r)===today), old=todo.filter(r=>dayOf(r)!==today);
    html += liveStrip();
    html += now.length? now.map(cardTodo).join("") : `<div class="empty">오늘 직접 주문할 건이 없습니다 🎉</div>`;
    if(old.length) html += `<div class="group">이전 미처리 ${old.length}건 — 이미 지난 주문이면 [주문실패]+사유로 닫아 주세요</div>`+old.map(cardTodo).join("");
  }
  else if(tab==="today"){
    // 날짜 선택 (주인님 2026-09-06: "현황에 날짜도") — 기본 오늘, 다른 날도 볼 수 있게
    const day=viewDay||today;
    const t=f.filter(r=>dayOf(r)===day);
    const done=t.filter(r=>r.result==="완주"&&!PARTIAL(r)).length, part=t.filter(PARTIAL).length, fail=t.filter(r=>r.result==="실패").length;
    const cats=new Map(); t.filter(r=>r.result==="실패").forEach(r=>{const k=r.category||"(미분류)";cats.set(k,(cats.get(k)||0)+1)});
    const byPc=new Map(); t.forEach(r=>{const p=pcOf(r); byPc.set(p,(byPc.get(p)||0)+1)});
    const w=new Date(day+"T00:00:00"); const wd=["일","월","화","수","목","금","토"][isNaN(w)?0:w.getDay()];
    html+=liveStrip()+`<div class="row" style="margin:0 0 10px"><b style="font-size:16px">${esc(day)} (${wd})</b> <input type="date" id="viewDay" value="${esc(day)}" max="${today}" style="padding:4px 8px"> <button class="small" id="viewToday">오늘</button>
      <span class="muted small">· PC별 담당자: ${[...byPc.entries()].map(([p,n])=>`<b>${esc(p)}</b> ${esc((pcs[p]||{}).monitor||"(이름 없음)")} ${n}건`).join(" · ")||"—"}</span></div>
    <div class="kpi"><div><b>${t.length}</b>시도</div><div><b style="color:var(--ok)">${done}</b>완주</div>${part?`<div><b style="color:#9fd0ff">${part}</b>부분(음료 빠짐)</div>`:""}<div><b style="color:var(--bad)">${fail}</b>실패</div><div><b>${t.length?Math.round(100*done/t.length):0}%</b>완주율(시도 기준)</div><div><b>${new Set(t.map(r=>r.order_id)).size}</b>주문 수</div></div>
    <div class="card"><b>실패 분류</b><div class="row">${[...cats.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag fail">${esc(k)} ${esc(v)}</span>`).join("")||'<span class="muted">없음</span>'}</div></div>
    <div class="card" style="overflow-x:auto"><table class="wide"><tr><th>날짜 · 시작 → 종료 · 소요</th><th>담당자 (PC)</th><th>와우패스 주문번호</th><th>브랜드 · 지점</th><th>시킨 사람 위치</th><th>주문 내용</th><th>결과</th><th>분류</th><th>담당자 입력</th></tr>
    ${t.slice(0,400).map(r=>`<tr><td class="nw">${whenCell(r)}</td><td class="nw">${esc(whoOf(r)||"—")} <span class="muted small">(${esc(pcOf(r))})</span></td><td class="nw"><b>${esc(r.order_id)}</b></td><td>${esc(r.brand)}${r.store?` · <b>${esc(r.store)}</b>`:""}</td><td class="small">${esc(r.hotel)}</td><td class="small">${esc(r.menu)}</td><td class="nw">${resultTag(r)}</td><td class="small nw">${esc(r.category||"")}</td><td class="small">${r.human_action?`<b>${esc(r.human_action)}</b> `:""}${esc(r.human_reason_cat||"")}${r.human_by?` <span class="muted">(${esc(r.human_by)})</span>`:""}</td></tr>`).join("")}</table></div>`;
  }
  else if(tab==="daily"){
    // 일별 통계 (주인님 2026-09-08: "일자별 주문/실패/성공률/실패 유형") — 주문 단위로 센다(같은 주문 여러 시도 = 1)
    const days=dailyStats(f);
    // 기간 합계는 주문을 **한 번만** 센다 (여러 날에 걸쳐 재시도한 주문을 날마다 더하면 부풀려짐). 완주 = 기간 중 한 번이라도 완주.
    const T=orderStats(f);
    html+=liveStrip()+`<div class="row" style="margin:0 0 10px"><b style="font-size:16px">일별 통계</b> <span class="muted small">최근 ${WINDOW_DAYS}일 · ${days.length}일치 · 날짜를 누르면 그날 현황으로</span></div>
    <div class="kpi"><div><b>${T.orders}</b>주문 수 <span class="muted small">(기간, 중복 없이)</span></div><div><b style="color:var(--ok)">${T.done}</b>완주(주문)</div>${T.part?`<div><b style="color:#9fd0ff">${T.part}</b>부분</div>`:""}<div><b style="color:var(--bad)">${T.fail}</b>아직 실패</div><div><b>${T.orders?Math.round(100*T.done/T.orders):0}%</b>완주율(주문 기준)</div><div><b>${T.tries}</b>시도</div><div><b>${T.human}</b>담당자 입력</div></div>
    <div class="card"><b>실패 유형 (기간 전체 — 아직 완주 못 한 주문의 마지막 시도 기준)</b><div class="row">${[...T.cats.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag fail">${esc(k)} ${v}</span>`).join("")||'<span class="muted">없음</span>'}</div></div>

// 일별 집계 — 주문 단위. 한 주문의 그날 시도 중 하나라도 완주면 완주, 완주 없이 부분만 있으면 부분, 둘 다 없으면 실패(유형은 마지막 시도의 분류)
function orderStats(rs){
  const orders=new Map();                                     // order_id → rows (시도시각 내림차순 유지)
  for(const r of rs){ if(!orders.has(r.order_id)) orders.set(r.order_id,[]); orders.get(r.order_id).push(r); }
  let done=0, part=0, fail=0; const cats=new Map(), pcsM=new Map();
  for(const [,ors] of orders){
    if(ors.some(x=>x.result==="완주"&&!PARTIAL(x))) done++;
    else if(ors.some(PARTIAL)) part++;
    else { fail++; const k=(ors[0].category||"(미분류)"); cats.set(k,(cats.get(k)||0)+1); }
  }
  rs.forEach(r=>{ const p=pcOf(r); pcsM.set(p,(pcsM.get(p)||0)+1); });
  const human=new Set(rs.filter(r=>r.human_action||r.human_reason_cat).map(r=>r.order_id)).size;
  return {orders:orders.size,tries:rs.length,done,part,fail,cats,human,pcs:pcsM};
}
function dailyStats(list){
  const byDay=new Map();
  for(const r of list){ const d=dayOf(r); if(!d) continue; if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(r); }
  const out=[];
  for(const [day,rs] of byDay){
    const w=new Date(day+"T00:00:00"); const wd=["일","월","화","수","목","금","토"][isNaN(w)?0:w.getDay()];
    out.push(Object.assign({day,wd},orderStats(rs)));
  }
  return out.sort((a,b)=>a.day<b.day?1:-1);
}

    <dt>배민 위치 검색</dt><dd>${where}</dd>

// ★ 저장 후 수정 (주인님 2026-09-06): 고치면 learned/applied 를 되돌려 AI 가 **다시 학습**하게 한다. 잠금 없이 주문 단위로 덮어쓴다.
async function editReason(id){ const r0=byId(id); if(!r0) return; const r=full(r0); if(!needName()) return;
  if(!details.has(id)) return toast("메모를 아직 불러오는 중입니다 — 잠시 후 다시 눌러주세요");   // 메모(상세)가 없는 채로 저장하면 기존 메모가 지워진다
  const cat=(($("#erc-"+id)||{}).value||""), noteDirty=dirty.has("enote-"+id), note=(($("#enote-"+id)||{}).value||"").trim();
  if(cat===(r.human_reason_cat||"") && (!noteDirty || note===(r.human_note||""))) return toast("바뀐 내용이 없습니다");
  // 사유를 비우면 메모만 고친다(사유·틀린쪽은 그대로). 메모는 **손댔을 때만** 보낸다. 잠금: 내가 본 human_at 그대로일 때만 — 남이 먼저 고쳤으면 0행
  const body={human_by:me(),human_at:new Date().toISOString(),learned:false};
  if(noteDirty) body.human_note=note||null;
  if(cat){ body.human_reason_cat=cat; body.who_wrong=WHO[cat]||"AI"; }
  const lock = r.human_at? "&human_at=eq."+enc(r.human_at) : "&human_at=is.null";
  try{ const upd=await patch("order_reports","order_id=eq."+enc(r.order_id)+"&or=(human_reason_cat.not.is.null,human_action.not.is.null)"+lock, body);
    dirty.clear();
    if(!upd.length){ toast("다른 담당자가 먼저 고쳤습니다 — 이 주문을 다시 불러왔습니다",true); await reloadOrder(r.order_id); }
    else { toast("수정 저장 — AI 가 다시 학습합니다(반영 표시 해제)"); mergeRows(upd); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }
async function editAnswer(id){ if(!needName()) return; const q=qs.find(x=>x.id===id); if(!q) return; const a=((($("#eans-"+id)||{}).value)||"").trim(); if(!a) return toast("답을 적어주세요");
  if(a===(q.answer||"")) return toast("바뀐 내용이 없습니다");
  const lock = q.edited_at? "&edited_at=eq."+enc(q.edited_at) : "&edited_at=is.null";
  try{ const upd=await patch("questions","id=eq."+id+lock,{answer:a,answered_by:me(),edited_at:new Date().toISOString(),applied:false});
    dirty.clear();
    if(!upd.length){ toast("다른 담당자가 먼저 고쳤습니다 — 이 질문을 다시 불러왔습니다",true); await reloadQ(id); }
    else { toast("답 수정 — AI 가 다시 반영합니다"); mergeQs(upd); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }
function editReasonBox(r0){ const r=full(r0); const id=Number(r.id); if(!details.has(id)) return `<div class="row small muted">메모 불러오는 중…</div>`; const known=REASONS.some(([v])=>v===r.human_reason_cat);
  return `<div class="row"><select id="erc-${id}"><option value="" ${known?"":"selected"}>${r.human_reason_cat&&!known?`(현재: ${esc(r.human_reason_cat)})`:"(사유 없음 — 메모만)"}</option>${REASONS.map(([v,l])=>`<option value="${v}" ${v===r.human_reason_cat?"selected":""}>${l}</option>`).join("")}</select><input id="enote-${id}" type="text" value="${esc(r.human_note||"")}" placeholder="한 줄"><button class="ok" onclick="editReason(${id})">수정 저장</button></div>` }
async function answer(id){ if(!needName()) return; const a=((($("#ans-"+id)||{}).value)||"").trim(); if(!a) return toast("답을 적어주세요");
  try{ const upd=await patch("questions","id=eq."+id+"&answer=is.null",{answer:a,answered_by:me(),answered_at:new Date().toISOString()});
    if(!upd.length){ toast("이미 다른 담당자가 답했습니다 — 이 질문을 다시 불러왔습니다",true); await reloadQ(id); }
    else { toast("답 저장 — AI 가 다음날 반영"); mergeQs(upd); render(false); }
  }catch(e){ toast("저장 실패: "+errText(e),true) } }

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render(false)});
$("#refresh").onclick=()=>load(true); $("#pcFilter").onchange=()=>render(false);
document.addEventListener("compositionstart",()=>composing=true); document.addEventListener("compositionend",()=>composing=false);
$("#gateOk").onclick=commitGate; $("#gateName").addEventListener("keydown",e=>{ if(e.key==="Enter") commitGate(); });
$("#meChange").onclick=showGate;
paintMe(); if(!ME) showGate();                       // 세션(이름) 없으면 먼저 받는다 — 데이터는 뒤에서 미리 불러온다
load(true); setInterval(()=>{ if(document.visibilityState==="hidden") return; load(false); }, POLL_MS);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(false); });
</script>
